<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Jordbærpikene Kjøkken</title>
    <meta name="theme-color" content="#f5f5ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JP Kjøkken" />
    <!-- Profilfonter (Signal + Maison Neue) bygges inn via src/styles/fonts.css.
         Ingen ekstern fontlasting lenger. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // PWA: manifest + app-ikon injiseres i runtime (unngår build-håndtering),
      // og service worker registreres for offline-bruk.
      (function () {
        function add(tag, attrs) {
          var el = document.createElement(tag);
          for (var k in attrs) el.setAttribute(k, attrs[k]);
          document.head.appendChild(el);
        }
        add("link", { rel: "manifest", href: "./manifest.webmanifest" });
        add("link", { rel: "apple-touch-icon", href: "./icon-180.png" });
        if ("serviceWorker" in navigator) {
          // Auto-oppdatering: når en ny service worker tar over, last appen på
          // nytt én gang (men ikke ved aller første installasjon).
          var hadController = !!navigator.serviceWorker.controller;
          var refreshing = false;
          navigator.serviceWorker.addEventListener("controllerchange", function () {
            if (refreshing || !hadController) return;
            refreshing = true;
            window.location.reload();
          });
          var checkUpdate = function () {
            navigator.serviceWorker
              .getRegistration()
              .then(function (reg) {
                if (reg) reg.update();
              })
              .catch(function () {});
          };
          window.addEventListener("load", function () {
            navigator.serviceWorker
              .register("./sw.js")
              .then(function (reg) {
                if (reg) reg.update();
              })
              .catch(function () {});
          });
          // Sjekk etter ny versjon når appen kommer i forgrunnen igjen.
          document.addEventListener("visibilitychange", function () {
            if (!document.hidden) checkUpdate();
          });
        }
      })();
    </script>
  </body>
</html>
